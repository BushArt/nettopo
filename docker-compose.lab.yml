# NetTopo — Local Vulnerable Lab
# Provides three deliberately vulnerable targets on a predictable subnet.
# Usage: make lab   (or: docker compose -f docker-compose.lab.yml up -d)
# ─────────────────────────────────────────────────────────────────────────────
# WARNING: These containers are intentionally insecure.
# Run only on an isolated host-only or bridged network. Never expose to internet.

version: '3.8'

services:
  metasploitable:
    image: tleemcjr/metasploitable2
    networks:
      labnet:
        ipv4_address: 172.20.0.10

  dvwa:
    image: vulnerables/web-dvwa
    networks:
      labnet:
        ipv4_address: 172.20.0.11

  webgoat:
    image: webgoat/goat-and-wolf
    networks:
      labnet:
        ipv4_address: 172.20.0.12

  nettopo:
    build: .
    ports:
      - '8080:8080'
      - '8765:8765'
    network_mode: host   # needed to reach labnet from scanner

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
