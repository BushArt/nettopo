# NetTopo — Local Vulnerable Lab
# Usage: make lab
# WARNING: Intentionally insecure. Isolated network only.

services:
  dvwa:
    image: docker.io/vulnerables/web-dvwa
    networks:
      labnet:
        ipv4_address: 172.20.0.10

  ssh-target:
    image: docker.io/linuxserver/openssh-server:latest
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=password
      - USER_NAME=labuser
    networks:
      labnet:
        ipv4_address: 172.20.0.11

  probe:
    image: docker.io/nginx:alpine
    networks:
      labnet:
        ipv4_address: 172.20.0.12

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
